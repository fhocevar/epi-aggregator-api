[tool.poetry]
name = "epi-clipping-api"
version = "0.1.0"
description = "API de clipping epidemiologico (WHO + InfoDengue) com Postgres e alertas"
authors = ["Fernando <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = "^2.0.32"
asyncpg = "^0.31.0"
alembic = "^1.13.2"
httpx = "^0.27.0"
apscheduler = "^3.10.4"
python-dateutil = "^2.9.0.post0"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.8"
ruff = "^0.5.0"

[tool.ruff]
line-length = 110
